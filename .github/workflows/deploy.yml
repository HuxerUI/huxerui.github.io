name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve HuxerUI source for Web examples
        run: >-
          node --input-type=module --eval
          "import('./scripts/resolve-huxerui-source.mjs').then(async ({ resolveHuxerUISource }) => resolveHuxerUISource())"
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.19
      - name: Prepare HuxerUI host tools
        run: >-
          chmod +x
          .cache/huxerui/tools/prebuilt/linux/x86_64/hcg
          .cache/huxerui/tools/prebuilt/linux/x86_64/hrc
      - name: Compile documentation snippets
        run: npm run check:examples
      - name: Configure documentation contracts
        run: >-
          cmake
          -S tests/snippets
          -B .cache/docs-snippets
          -G Ninja
          -DHUXERUI_SOURCE_DIR=${{ github.workspace }}/.cache/huxerui
          -DHUXERUI_DOC_EXAMPLES_DIR=${{ github.workspace }}/.cache/docs-examples
      - run: cmake --build .cache/docs-snippets --parallel
      - name: Configure Web examples
        run: >-
          emcmake cmake
          -S .cache/huxerui
          -B .cache/huxerui-web-build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DHUXERUI_BUILD_SHARED=OFF
          -DHUXERUI_BUILD_STATIC=ON
          -DHUXERUI_BUILD_CLI=OFF
          -DHUXERUI_BUILD_TESTS=OFF
          -DHUXERUI_BUILD_EXAMPLES=ON
      - name: Build Web examples
        run: cmake --build .cache/huxerui-web-build --parallel --target $(node scripts/list-web-example-targets.mjs)
      - name: Stage independent Web applications
        env:
          HUXERUI_WEB_BUILD_DIR: ${{ github.workspace }}/.cache/huxerui-web-build
        run: npm run stage:examples
      - name: Build website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build
      - name: Check generated links
        run: npm run check:links
      - name: Check external links
        run: npm run check:external-links
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
